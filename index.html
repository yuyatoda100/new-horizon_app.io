<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NEW HORIZON3の英単語をタイピングで楽しく学べるアプリ">
    <meta name="theme-color" content="#4A90E2">
    
    <!-- PWA対応メタタグ -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="英単語アプリ">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="stylesheet" href="style_1.css">
    
    <title>NEW HORIZON 英単語タイピングアプリ</title>
</head>
<body>
    <div id="app">
        <header>
            <h1>NEW HORIZON 英単語タイピング</h1>
        </header>

        <!-- Mode選択（共通） -->
        <div class="mode-selector">
            <button id="mode-en-ja" class="mode-btn active" onclick="setMode('en-ja')">英 ➔ 日 (日本語入力)</button>
            <button id="mode-ja-en" class="mode-btn" onclick="setMode('ja-en')">日 ➔ 英 (英語入力)</button>
        </div>

        <!-- 1. トップ画面 (設定 & Unit・全復習選択 & 復習ノート) -->
        <main id="home-container">
            <div class="settings-box">
                <label for="question-count-select">出題数:</label>
                <select id="question-count-select">
                    <option value="10" selected>10問</option>
                    <option value="20">20問</option>
                    <option value="all">全問</option>
                </select>
            </div>

            <!-- 間違えた問題の復習ノート (トップ画面) -->
            <div id="home-incorrect-box" class="home-incorrect-box hidden">
                <div class="home-incorrect-header">
                    <h3>📝 復習ノート (要復習: <span id="home-incorrect-count">0</span>件)</h3>
                    <button class="clear-btn" onclick="clearSavedIncorrect()">履歴クリア</button>
                </div>
                <ul id="home-incorrect-list" class="incorrect-list"></ul>
                <button class="start-btn retry-btn" onclick="startIncorrectQuiz()">間違えた問題だけでテスト</button>
            </div>

            <h2>学習するUnitを選択してください</h2>
            <div id="unit-selection-list" class="unit-grid"></div>
        </main>

        <!-- 2. タイピング問題画面 -->
        <main id="quiz-container" class="hidden">
            <div class="quiz-header">
                <button class="back-btn" onclick="showHome()">← 戻る</button>
                <span id="quiz-unit-title" class="quiz-unit-title">Unit 0</span>
            </div>

            <div class="quiz-card">
                <div id="progress" class="question-number">1 / 10</div>
                <div id="prompt-label" class="prompt-label">問題 (英語)</div>
                <div id="card-word" class="word-display">discover</div>
                
                <form id="type-form" onsubmit="handleCheck(event)">
                    <input type="text" id="type-input" placeholder="回答を入力してEnter" autocomplete="off" />
                    <button type="submit" id="submit-btn" class="start-btn">判定</button>
                </form>

                <div id="feedback-container" class="feedback-container hidden">
                    <div id="feedback-result" class="feedback-result"></div>
                    <div id="feedback-answer" class="feedback-answer"></div>
                    <button id="next-btn" class="secondary-btn" onclick="nextQuestion()">次の問題へ</button>
                </div>
            </div>
        </main>

        <!-- 3. 結果画面 -->
        <main id="result-container" class="hidden">
            <h2>🎉 学習完了！</h2>
            <div class="result-stats">
                <p>正解: <span id="score-correct" class="score-correct">0</span> 問</p>
                <p>不正解: <span id="score-incorrect" class="score-incorrect">0</span> 問</p>
            </div>

            <div id="incorrect-list-container" class="incorrect-list-container">
                <h3>今回間違えた単語</h3>
                <ul id="incorrect-list" class="incorrect-list"></ul>
            </div>

            <div class="result-actions">
                <button id="retry-incorrect-btn" class="start-btn hidden" onclick="retryIncorrect()">間違えた問題だけ復習</button>
                <button class="secondary-btn" onclick="showHome()">Top画面へ戻る</button>
            </div>
        </main>
    </div>

    <script src="app_1.js"></script>
    <script>
        // Service Workerの登録（GitHub Pages対応）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('Service Worker登録成功:', registration);
                    })
                    .catch(error => {
                        console.log('Service Worker登録失敗:', error);
                    });
            });
        }

        // PWAのインストール促進
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log('インストール可能です');
        });
    </script>
</body>
</html>
